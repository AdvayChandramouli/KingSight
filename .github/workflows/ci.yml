name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Require source data and trained artifacts
        run: |
          test -f data/kc_house_data.csv
          test -f data/kc_cleaned_data.csv
          test -f artifacts/splits.json
          test -f artifacts/preprocessing/scaler.json
          test -f artifacts/xgboost/model.json
          test -f artifacts/xgboost/manifest.json
          test -f artifacts/gnn/model.pt
          test -f artifacts/gnn/nodes.npz
          test -f artifacts/gnn/manifest.json

      - name: Build the property catalog
        run: PYTHONPATH=src uv run python scripts/export_catalog.py

      - name: Pytest
        env:
          PYTHONPATH: src
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: uv run pytest tests/catalog tests/tabular tests/graph tests/api

  web:
    name: npm run check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run check
